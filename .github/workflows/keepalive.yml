name: Keep Supabase alive

on:
  schedule:
    # Daily — Supabase free-tier projects auto-pause after 7 days of no
    # database activity, so this keeps a comfortable margin.
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend keepalive endpoint
        run: |
          curl -sf --max-time 30 https://akpsi-backend.onrender.com/api/keepalive || exit 1
